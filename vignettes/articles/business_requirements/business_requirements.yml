- issue: 518
  title: 'Business Requirement: Generate an app to help CMs explore snapshot data'
  description: Generate a shiny app that presents the input and output of {[gsm.kri](https://github.com/Gilead-BioStats/gsm.kri)}
    in a way that allows clinical monitors (etc) to dive deeper and identify the sources
    of issues.
  features:
  - issue: 520
    title: 'Feature: The app always indicates the study with which it is associated.'
    acceptance_criteria:
    - By default, the app displays a title generated from the study information in
      dfGroups.
    - The app title can be customized at launch.
    labels: general
  - issue: 521
    title: 'Feature: The user can filter the data.'
    acceptance_criteria:
    - If the data contains more than one group level (e.g., "Site" vs "Country"),
      a "Group Level" filter is displayed.
    - If the "Group Level" filter is displayed, the user can filter the data by group
      level.
    - The user can filter the data by group (e.g., "Site" or "Country") within the
      selected "Group Level".
    - The user can filter the data by "Participant".
    - The user can reset all filters to their default values.
    labels: general
  - issue: 522
    title: 'Feature: The user can drill down into views of different aspects of the
      data.'
    acceptance_criteria: The user can navigate between the main sections of the app
      using a navigation bar at the top of the page.
    labels: general
  - issue: 523
    title: 'Feature: The user can view a card with a high-level overview of the study
      metadata.'
    acceptance_criteria: The card is the validated card generated by gsm.kri::Report_StudyInfo().
    labels: study-overview
  - issue: 524
    title: 'Feature: The user can view an interactive KRI summary table.'
    acceptance_criteria:
    - The table is the validated group overview generated by `gsm.kri::Widget_GroupOverview()`.
    - The KRI summary table is filtered to the selected "Group Level".
    - The user can filter the KRI summary table by flag status (red, amber, or both)
      using clickable pills.
    - The flag status pills display a count of KRIs with that flag status for the
      selected "Group Level".
    - Clicking a KRI cell in the summary table navigates the user to the "Metric Details"
      tab, filtered to that KRI and group.
    labels: study-overview
  - issue: 525
    title: 'Feature: The user can view a set of interactive scatter plots, one for
      each KRI.'
    acceptance_criteria:
    - The interactive scatter plots are based on `gsm.kri::Widget_ScatterPlot()`.
    - The set of scatter plots is filtered to show only plots relevant to the selected
      "Group Level".
    - Clicking a point in a scatter plot navigates the user to the "Metric Details"
      tab, filtered to that KRI and group.
    labels: study-overview
  - issue: 526
    title: 'Feature: The user can view visualizations of a single KRI.'
    acceptance_criteria:
    - The user can select the KRI via a dropdown menu.
    - The KRI selection dropdown is filtered to show only KRIs relevant to the selected
      "Group Level".
    - The user can navigate to different visualizations of this KRI via tabs.
    labels: metric-details
  - issue: 527
    title: 'Feature: The user can view an interactive scatter plot of the selected
      KRI''s latest results.'
    acceptance_criteria:
    - The interactive scatter plot is based on `gsm.kri::Widget_ScatterPlot()`.
    - The selected group is highlighted in the interactive scatter plot.
    - Clicking a group in the scatter plot updates the group drop-down.
    labels: metric-details
  - issue: 528
    title: 'Feature: The user can view an interactive bar chart of the selected KRI''s
      latest metric values.'
    acceptance_criteria:
    - The interactive bar chart (value) is based on `gsm.kri::Widget_BarChart()`.
    - The selected group is highlighted in the interactive bar chart (value).
    - Clicking a group in the bar chart (value) updates the group drop-down.
    labels: metric-details
  - issue: 529
    title: 'Feature: The user can view an interactive bar chart of the selected KRI''s
      latest scores.'
    acceptance_criteria:
    - The interactive bar chart (score) is based on `gsm.kri::Widget_BarChart()`.
    - The selected group is highlighted in the interactive bar chart (score).
    - Clicking a group in the bar chart (score) updates the group drop-down.
    labels: metric-details
  - issue: 530
    title: 'Feature: The user can view an interactive time-series plot of the selected
      KRI''s scores across all available data snapshots.'
    acceptance_criteria:
    - The interactive time-series plot is based on `gsm.kri::Widget_TimeSeries()`.
    - The selected group is highlighted in the interactive time-series plot.
    - Clicking a group in the time-series plot updates the group drop-down.
    labels: metric-details
  - issue: 531
    title: 'Feature: The user can view a table of the KRI results for each group.'
    acceptance_criteria:
    - The KRI results table is generated by `gsm.kri::Report_MetricTable()`.
    - The selected group is highlighted in the KRI results table.
    - Clicking a group in the KRI results table updates the group drop-down.
    labels: metric-details
  - issue: 532
    title: 'Feature: When a group is selected, the user can view that group''s metadata.'
    acceptance_criteria: The group metadata contains all information about this Group
      from the `dfGroups` input table.
    labels: metric-details
  - issue: 533
    title: 'Feature: When a group is selected, the user can view a table of participants
      within that group.'
    acceptance_criteria:
    - The participant table shows each participant's numerator, denominator, and metric
      values for the selected KRI.
    - Clicking a participant in the participant table selects that participant and
      navigates to the Domain Details tab.
    labels: metric-details
  - issue: 534
    title: 'Feature: The user can view raw domain data.'
    acceptance_criteria:
    - The user can switch between different domain data views using a set of tabs.
    - The user can view the raw data for the selected domain in a table.
    - The domain data table is filtered by the selected "Group" and "Participant".
    - The app displays an error message if it is unable to load data for a specific
      domain.
    labels: domain-details
  - issue: 535
    title: 'Feature: The user can view a summary of the number of records for each
      available data domain.'
    acceptance_criteria:
    - The domain summary counts update based on the selected "Group" and "Participant"
      filters.
    - Clicking a domain in the summary list switches the view to that domain's data
      tab.
    labels:
    - domain-details
    - superseded
  - issue: 536
    title: 'Feature: The user can view tabs provided by plugins.'
    acceptance_criteria:
    - If a single plugin is included in the app, it appears as a new tab.
    - If a plugin specifies required inputs, a placeholder is shown if that input
      is set to "All".
    - If multiple plugins are provided, they are grouped under a "Plugins" dropdown
      menu in the navigation bar.
    labels: plugins
- issue: 519
  title: 'Business Requirement: Users can easily explore Domain Details'
  description: Make it easier for users to explore the raw domain data presented on
    the Domain Details tab.
  features:
  - issue: 543
    title: 'Feature: The user can view counts of records for each available data domain.'
    acceptance_criteria:
    - Domain row counts appear in parentheses after the title of each domain in the
      Domain Details tab's tabbed view of tables.
    - The domain row counts update based on the selected "Group" and "Participant"
      filters.
    - The Domain Summary panel no longer appears on the Domain Details tab.
    labels: domain-details
  - issue: 385
    title: 'Feature: The user can filter domain data.'
    acceptance_criteria:
    - Each column in the domain data tables has a field where users can type.
    - Data in the table is subset to include whatever is typed.
    labels: domain-details
  - issue: 496
    title: 'Feature: The user can visualize domain categorical variable counts by
      value.'
    acceptance_criteria:
    - The 'Domain Details' tab includes a 'Prevalence' card for each domain.
    - The user can select a column to display in the 'Prevalence' card (out of all
      categorical-like fields other than group level, group id, and subject id), defaulting
      to the first valid column.
    - The 'Prevalence' card displays a color-coded key for Study.
    - The 'Prevalence' card displays a bar plot of '% of rows' vs the values of the
      selected column, colored to indicate that it is at the Study level.
    - The 'Prevalence' card displays a label with the numeric % of each value, colored
      to indicate that it is at the Study level.
    - When a group is selected, the 'Prevalence' card displays a color-coded key for
      that group, as '{Group Level} {GroupID}'.
    - When a group is selected, the 'Prevalence' card also displays a bar filtered
      to just the selected group, colored to indicate that it is at the Group level.
    - When a group is selected, the 'Prevalence' card also displays a label with the
      numeric % of each value filtered to just the selected group, colored to indicate
      that it is at the Group level.
    - When a participant is selected, the 'Prevalence' card displays a color-coded
      key for that participant, as 'Participant {SubjectID}'.
    - When a participant is selected, the 'Prevalence' card also displays a bar filtered
      to just the selected participant, colored to indicate that it is at the Participant
      level.
    - When a participant is selected, the 'Prevalence' card also displays a label
      with the numeric % of each value filtered to just the selected participant,
      colored to indicate that it is at the Participant level.
    - The user can turn the Study bar and label on and off using the color-coded Study
      key.
    - When a group is selected, the user can turn the Group bar and label on and off
      using the color-coded Group key.
    - When a participant is selected, the user can turn the Participant bar and label
      on and off using the color-coded Participant key.
    - When there are more than 6 values, the plot shows the top 5 values plus 'Other'.
    labels: domain-details
  - issue: 555
    title: 'Feature: Increase number of rows shown in domain details'
    acceptance_criteria:
    - Domain data tables show up to 100 rows by default.
    - Users can change the number of displayed rows to 20 or 1000.
    labels: domain-details
